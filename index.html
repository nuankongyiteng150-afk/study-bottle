<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集中ボトル v2</title>

<style>
body{
    text-align:center;
    font-family:sans-serif;
    background:#f0f8ff;
    padding-bottom:50px;
}

input{
    padding:8px;
    margin:5px;
    width:80%;
    max-width:200px;
}

button{
    padding:8px 15px;
    margin:5px;
    cursor:pointer;
    background:#4facfe;
    color:white;
    border:none;
    border-radius:5px;
}

#calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    width:300px;
    margin:20px auto;
}

.day{
    padding:10px;
    border:1px solid #ccc;
    font-size:12px;
}

.done{
    background:#4facfe;
    color:white;
}

.card{
    background:white;
    padding:15px;
    margin:15px auto;
    max-width:350px;
    border-radius:10px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

#timeline{
    max-width:400px;
    margin:30px auto;
    text-align:left;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

.post-card{
    border-bottom:1px solid #eee;
    padding:10px 0;
}
</style>
</head>

<body>

<h1>💧 集中ボトル v2</h1>

<svg width="160" height="220" viewBox="0 0 200 260">
    <path d="M100 10 C140 70,180 110,180 160 C180 210,140 250,100 250 C60 250,20 210,20 160 C20 110,60 70,100 10 Z"
        fill="none"
        stroke="#333"
        stroke-width="4"/>

    <clipPath id="waterClip">
        <rect id="waterRect"
            x="0"
            y="250"
            width="200"
            height="250"/>
    </clipPath>

    <path d="M100 10 C140 70,180 110,180 160 C180 210,140 250,100 250 C60 250,20 210,20 160 C20 110,60 70,100 10 Z"
        fill="#4facfe"
        clip-path="url(#waterClip)"/>
</svg>

<div id="waterPercent">
0%
</div>

<div class="card">

<h3>🔥 ストリーク</h3>
<div id="streakCount">0日</div>

<h3>👑 ベスト記録</h3>
<div id="bestStreak">0日</div>

<h3>🤖 今日のアドバイス</h3>
<div id="adviceText">
まずは1タスク終わらせよう！
</div>

</div>

<h3>タスク追加</h3>

<input
type="text"
id="userName"
placeholder="あなたの名前">

<input
type="text"
id="taskName"
placeholder="内容">

<input
type="number"
id="taskPercent"
placeholder="%"
min="1"
max="100">

<button onclick="addTask()">
追加
</button>

<h3>タスク一覧</h3>

<div id="taskList"></div>

<button
onclick="resetWater()"
style="background:#ff7675;">
リセット
</button>

<h3>📅 勉強カレンダー</h3>

<div id="calendar"></div>

<div id="timeline">

<h3 style="text-align:center;">
👥 みんなの勉強ボトル
</h3>

<div id="timeline-posts">
読み込み中...
</div>

</div>

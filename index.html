<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>集中ボトル</title>
</head>
<body>
    <h1>💧 集中ボトル</h1>
    <p>読み込み中...</p>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRwJ40dbH9VPj06Q3OzHEQdLwCUALDH2c",
            authDomain: "study-bottle.firebaseapp.com",
            projectId: "study-bottle",
            storageBucket: "study-bottle.firebasestorage.app",
            messagingSenderId: "58806870643",
            appId: "1:58806870643:web:53b3309cca97d1cb548006"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        signInAnonymously(auth).then(() => {
            document.body.innerHTML = "<h1>💧 接続成功！</h1>";
            const col = collection(db, "posts");
            onSnapshot(col, (snapshot) => {
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const p = document.createElement('p');
                    p.innerText = "データ発見: " + data.taskName;
                    document.body.appendChild(p);
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集中ボトル</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 🔗 あなたのFirebaseの接続情報（本物！）
        const firebaseConfig = {
            apiKey: "AIzaSyBRwJ40dbH9VPj06Q3OzHEQdLwCUALDH2c",
            authDomain: "study-bottle.firebaseapp.com",
            projectId: "study-bottle",
            storageBucket: "study-bottle.firebasestorage.app",
            messagingSenderId: "58806870643",
            appId: "1:58806870643:web:53b3309cca97d1cb548006"
        };

        // Firebaseの起動
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 匿名ログインを実行してタイムラインを動かす
        signInAnonymously(auth)
            .then(() => {
                setupTimeline();
            })
            .catch((error) => {
                console.error("ログインエラー:", error);
                document.getElementById('timeline-posts').innerHTML = '<p style="color:red;">接続エラーが発生しました。</p>';
            });

        // タイムラインの読み込み（リアルタイム監視）
        function setupTimeline() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(20));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('timeline-posts');
                container.innerHTML = '';
                
                if (snapshot.empty) {
                    container.innerHTML = '<p style="color:#777; text-align:center;">まだ投稿がありません。最初の進捗を投稿しよう！</p>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const postId = docSnap.id();
                    const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                    
                    const postCard = document.createElement('div');
                    postCard.className = 'post-card';
                    postCard.innerHTML = `
                        <div class="post-info">⏱️ ${date}</div>
                        <div style="font-size: 15px; margin: 5px 0;">
                            🔥 <strong>${escapeHTML(data.taskName)}</strong> を <strong>${data.percent}%</strong> 達成しました！
                        </div>
                        <button class="like-btn" onclick="window.likePost('${postId}')">👍 いいね (${data.likes || 0})</button>
                    `;
                    container.appendChild(postCard);
                });
            }, (error) => {
                console.error("データ読み込みエラー:", error);
                document.getElementById('timeline-posts').innerHTML = '<p style="color:red;">データの読み込みに失敗しました。</p>';
            });
        }

        // いいねボタンの処理（グローバル関数にする）
        window.likePost = async function(postId) {
            try {
                const postRef = doc(db, "posts", postId);
                await updateDoc(postRef, {
                    likes: increment(1)
                });
            } catch (e) {
                console.error("いいねエラー:", e);
            }
        };

        // 投稿の処理（ボタンを押したときに動く）
        window.submitPost = async function(taskName, percent) {
            try {
                await addDoc(collection(db, "posts"), {
                    taskName: taskName,
                    percent: Number(percent),
                    likes: 0,
                    createdAt: new Date()
                });
            } catch (e) {
                console.error("投稿エラー:", e);
            }
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>

    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            background: #f0f8ff;
            padding-bottom: 50px;
        }
        input { padding: 5px; margin: 5px; }
        button { padding: 6px 12px; margin: 3px; }
        #calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; width: 300px; margin: 20px auto; }
        .day { padding: 10px; border: 1px solid #ccc; font-size: 12px; }
        .done { background: #4facfe; color: white; }
        
        /* 👥 タイムラインのスタイル */
        #timeline {
            max-width: 400px;
            margin: 30px auto;
            text-align: left;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .post-card { border-bottom: 1px solid #eee; padding: 10px 0; }
        .post-card:last-child { border-bottom: none; }
        .post-info { font-size: 11px; color: #777; }
        .like-btn {
            background: #ff7675;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>💧 集中ボトル</h1>
    <svg width="160" height="220" viewBox="0 0 200 260">
        <path d="M100 10 C140 70, 180 110, 180 160 C180 210, 140 250, 100 250 C60 250, 20 210, 20 160 C20 110, 60 70, 100 10 Z" fill="none" stroke="#333" stroke-width="4"/>
        <clipPath id="waterClip">
            <rect id="waterRect" x="0" y="250" width="200" height="250"/>
        </clipPath>
        <path d="M100 10 C140 70, 180 110, 180 160 C180 210, 140 250, 100 250 C60 250, 20 210, 20 160 C20 110, 60 70, 100 10 Z" fill="#4facfe" clip-path="url(#waterClip)"/>
    </svg>
    <div id="waterPercent" style="margin:10px; font-weight:bold;">0%</div>
    <div id="streak" style="margin:10px; font-weight:bold; color:#ff7675;">🔥 連続日数: 0日</div>

    <h3>タスク追加</h3>
    <input type="text" id="taskName" placeholder="内容">
    <input type="number" id="taskPercent" placeholder="%" min="1" max="100">
    <button onclick="addTask()">追加</button>

    <h3>タスク一覧</h3>
    <div id="taskList"></div>
    <button onclick="resetWater()" style="margin-top:10px;">リセット</button>

    <h3>📅 勉強カレンダー</h3>
    <div id="calendar"></div>

    <div id="timeline">
        <h3 style="margin-top:0; text-align:center;">👥 みんなの勉強ボトル</h3>
        <div id="timeline-posts">タイムラインを読み込み中...</div>
    </div>

    <script>
        let totalWater = 0;
        let tasks = JSON.parse(localStorage.getItem('bottleTasks')) || [];
        let completedDates = JSON.parse(localStorage.getItem('bottleDates')) || [];
        let streak = Number(localStorage.getItem('bottleStreak')) || 0;
        let lastDate = localStorage.getItem('bottleLastDate') || "";

        function updateUI() {
            totalWater = Math.min(totalWater, 100);
            document.getElementById('waterPercent').innerText = totalWater + "%";
            let yPos = 250 - (totalWater * 2.4);
            document.getElementById('waterRect').setAttribute('y', yPos);
            document.getElementById('streak').innerText = "🔥 連続日数: " + streak + "日";

            let taskList = document.getElementById('taskList');
            taskList.innerHTML = "";
            tasks.forEach((t, index) => {
                taskList.innerHTML += `<div style="margin:5px;">${t.name} (+${t.percent}%) <button onclick="doTask(${index})">やった</button> <button onclick="deleteTask(${index})">削除</button></div>`;
            });
            renderCalendar();
        }

        function addTask() {
            let name = document.getElementById('taskName').value;
            let percent = document.getElementById('taskPercent').value;
            if(!name || !percent) return;
            tasks.push({name: name, percent: Number(percent)});
            localStorage.setItem('bottleTasks', JSON.stringify(tasks));
            document.getElementById('taskName').value = "";
            document.getElementById('taskPercent').value = "";
            updateUI();
        }

        function doTask(index) {
            let task = tasks[index];
            totalWater += task.percent;
            
            // 👥 Firebaseのタイムラインへ進捗を送信する
            if (window.submitPost) {
                window.submitPost(task.name, task.percent);
            }

            let todayStr = new Date().toLocaleDateString();
            if(!completedDates.includes(todayStr)) {
                completedDates.push(todayStr);
                localStorage.setItem('bottleDates', JSON.stringify(completedDates));
                updateStreak();
            }
            updateUI();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('bottleTasks', JSON.stringify(tasks));
            updateUI();
        }

        function resetWater() {
            totalWater = 0;
            updateUI();
        }

        function updateStreak() {
            let today = new Date();
            let todayStr = today.toLocaleDateString();
            let yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            let yesterdayStr = yesterday.toLocaleDateString();

            if (lastDate === yesterdayStr) {
                streak++;
            } else if (lastDate !== todayStr) {
                streak = 1;
            }
            lastDate = todayStr;
            localStorage.setItem('bottleStreak', streak);
            localStorage.setItem('bottleLastDate', lastDate);
        }

        function renderCalendar() {
            let calendar = document.getElementById('calendar');
            calendar.innerHTML = "";
            let today = new Date();
            let year = today.getFullYear();
            let month = today.getMonth();
            let daysInMonth = new Date(year, month + 1, 0).getDate();

            for(let i = 1; i <= daysInMonth; i++) {
                let dateStr = new Date(year, month, i).toLocaleDateString();
                let isDone = completedDates.includes(dateStr);
                calendar.innerHTML += `<div class="day ${isDone ? 'done' : ''}">${i}</div>`;
            }
        }

        updateUI();
    </script>
</body>
</html>

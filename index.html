<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集中ボトル v2</title>

<style>
body{
    text-align:center;
    font-family:sans-serif;
    background:#f0f8ff;
    padding-bottom:50px;
}

input{
    padding:8px;
    margin:5px;
    width:80%;
    max-width:200px;
}

button{
    padding:8px 15px;
    margin:5px;
    cursor:pointer;
    background:#4facfe;
    color:white;
    border:none;
    border-radius:5px;
}

#calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    width:300px;
    margin:20px auto;
}

.day{
    padding:10px;
    border:1px solid #ccc;
    font-size:12px;
}

.done{
    background:#4facfe;
    color:white;
}

.card{
    background:white;
    padding:15px;
    margin:15px auto;
    max-width:350px;
    border-radius:10px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

#timeline{
    max-width:400px;
    margin:30px auto;
    text-align:left;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

.post-card{
    border-bottom:1px solid #eee;
    padding:10px 0;
}
</style>
</head>

<body>

<h1>💧 集中ボトル v2</h1>

<svg width="160" height="220" viewBox="0 0 200 260">
    <path d="M100 10 C140 70,180 110,180 160 C180 210,140 250,100 250 C60 250,20 210,20 160 C20 110,60 70,100 10 Z"
        fill="none"
        stroke="#333"
        stroke-width="4"/>

    <clipPath id="waterClip">
        <rect id="waterRect"
            x="0"
            y="250"
            width="200"
            height="250"/>
    </clipPath>

    <path d="M100 10 C140 70,180 110,180 160 C180 210,140 250,100 250 C60 250,20 210,20 160 C20 110,60 70,100 10 Z"
        fill="#4facfe"
        clip-path="url(#waterClip)"/>
</svg>

<div id="waterPercent">
0%
</div>

<div class="card">

<h3>🔥 ストリーク</h3>
<div id="streakCount">0日</div>

<h3>👑 ベスト記録</h3>
<div id="bestStreak">0日</div>

<h3>🤖 今日のアドバイス</h3>
<div id="adviceText">
まずは1タスク終わらせよう！
</div>

</div>

<h3>タスク追加</h3>

<input
type="text"
id="userName"
placeholder="あなたの名前">

<input
type="text"
id="taskName"
placeholder="内容">

<input
type="number"
id="taskPercent"
placeholder="%"
min="1"
max="100">

<button onclick="addTask()">
追加
</button>

<h3>タスク一覧</h3>

<div id="taskList"></div>

<button
onclick="resetWater()"
style="background:#ff7675;">
リセット
</button>

<h3>📅 勉強カレンダー</h3>

<div id="calendar"></div>

<div id="timeline">

<h3 style="text-align:center;">
👥 みんなの勉強ボトル
</h3>

<div id="timeline-posts">
読み込み中...
</div>

</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    addDoc,
    query,
    where,
    deleteDoc,
    getDocs,
    doc
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import {
    getAuth,
    signInAnonymously
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBRwJ40dbH9VPj06Q3OzHEQdLwCUALDH2c",
    authDomain: "study-bottle.firebaseapp.com",
    projectId: "study-bottle",
    storageBucket: "study-bottle.firebasestorage.app",
    messagingSenderId: "58806870643",
    appId: "1:58806870643:web:53b3309cca97d1cb548006"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let totalWater =
    Number(localStorage.getItem("bottleTotalWater"))
    || 0;

let tasks =
    JSON.parse(localStorage.getItem("bottleTasks"))
    || [];

let completedDates =
    JSON.parse(localStorage.getItem("bottleDates"))
    || [];

let bestStreak =
    Number(localStorage.getItem("bestStreak"))
    || 0;

function calculateStreak(){

    if(completedDates.length === 0){
        return 0;
    }

    let dates = completedDates
        .map(d => new Date(d))
        .sort((a,b)=>b-a);

    let streak = 1;

    for(let i=0;i<dates.length-1;i++){

        let diff =
        (dates[i]-dates[i+1]) /
        (1000*60*60*24);

        if(Math.round(diff) === 1){
            streak++;
        }else{
            break;
        }
    }

    return streak;
}

function updateAdvice(){

    let streak = calculateStreak();

    if(streak > bestStreak){

        bestStreak = streak;

        localStorage.setItem(
            "bestStreak",
            bestStreak
        );
    }

    document.getElementById(
        "streakCount"
    ).innerText = streak + "日";

    document.getElementById(
        "bestStreak"
    ).innerText = bestStreak + "日";

    let advice = "";

    if(streak === 0){

        advice =
        "まずは1タスク終わらせよう！";

    }else if(streak < 3){

        advice =
        `🔥 ${streak}日継続中！まずは3日連続を目指そう！`;

    }else if(streak < 7){

        advice =
        `🔥 ${streak}日継続中！あと少しで1週間達成！`;

    }else if(streak < 30){

        advice =
        `🔥 ${streak}日継続中！勉強習慣が身についてきたね！`;

    }else{

        advice =
        `👑 ${streak}日継続中！完全に習慣化できてる！`;
    }

    document.getElementById(
        "adviceText"
    ).innerText = advice;
}
function updateUI(){

    totalWater = Math.min(totalWater,100);

    document.getElementById(
        "waterPercent"
    ).innerText = totalWater + "%";

    document.getElementById(
        "waterRect"
    ).setAttribute(
        "y",
        250 - (totalWater * 2.4)
    );

    let taskList =
        document.getElementById("taskList");

    taskList.innerHTML = "";

    tasks.forEach((t,i)=>{

        taskList.innerHTML += `
        <div style="margin:5px;">
            ${t.name}
            (+${t.percent}%)

            <button
            onclick="doTask(${i})">
            やった
            </button>

            <button
            onclick="deleteTask(${i})"
            style="background:#ff7675;">
            削除
            </button>
        </div>
        `;
    });

    renderCalendar();
    updateAdvice();
}

window.addTask = () => {

    let u =
    document.getElementById(
        "userName"
    ).value || "名無しさん";

    let n =
    document.getElementById(
        "taskName"
    ).value;

    let p =
    Number(
        document.getElementById(
            "taskPercent"
        ).value
    );

    if(!n || !p) return;

    tasks.push({
        user:u,
        name:n,
        percent:p
    });

    localStorage.setItem(
        "bottleTasks",
        JSON.stringify(tasks)
    );

    updateUI();
};

window.deleteTask = (i) => {

    tasks.splice(i,1);

    localStorage.setItem(
        "bottleTasks",
        JSON.stringify(tasks)
    );

    updateUI();
};

window.doTask = async (i) => {

    let t = tasks[i];

    totalWater += t.percent;

    localStorage.setItem(
        "bottleTotalWater",
        totalWater
    );

    let today =
    new Date().toLocaleDateString();

    if(!completedDates.includes(today)){

        completedDates.push(today);

        localStorage.setItem(
            "bottleDates",
            JSON.stringify(
                completedDates
            )
        );
    }

    await addDoc(
        collection(db,"posts"),
        {
            userName:t.user,
            taskName:t.name,
            percent:t.percent,
            createdAt:new Date()
        }
    );

    updateUI();
};

window.resetWater = () => {

    totalWater = 0;

    localStorage.setItem(
        "bottleTotalWater",
        0
    );

    updateUI();
};

function renderCalendar(){

    let calendar =
    document.getElementById(
        "calendar"
    );

    calendar.innerHTML = "";

    let today = new Date();

    let daysInMonth =
    new Date(
        today.getFullYear(),
        today.getMonth()+1,
        0
    ).getDate();

    for(let i=1;i<=daysInMonth;i++){

        let d =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            i
        ).toLocaleDateString();

        calendar.innerHTML += `
        <div class="day ${
            completedDates.includes(d)
            ? "done"
            : ""
        }">
            ${i}
        </div>
        `;
    }
}

signInAnonymously(auth)
.then(()=>{

    onSnapshot(
        collection(db,"posts"),
        (snap)=>{

            const container =
            document.getElementById(
                "timeline-posts"
            );

            container.innerHTML = "";

            const posts = [];

            snap.forEach((doc)=>{

                posts.push({
                    id:doc.id,
                    ...doc.data()
                });

            });

            posts.sort(
                (a,b)=>
                b.createdAt.seconds -
                a.createdAt.seconds
            );

            posts.forEach((d)=>{

                const date =
                d.createdAt
                ? new Date(
                    d.createdAt.seconds
                    *1000
                  ).toLocaleString()
                : "";

                container.innerHTML += `
                <div class="post-card">

                    <div style="
                    font-size:11px;
                    color:#888;">
                    ⏱️ ${date}
                    </div>

                    <strong>
                    ${d.userName}
                    </strong>

                    さんが

                    🔥${d.taskName}

                    を

                    ${d.percent}%

                    達成！

                </div>
                `;
            });

        }
    );

});

updateUI();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集中ボトル</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f8ff; padding-bottom: 50px; }
        input { padding: 5px; margin: 5px; }
        button { padding: 6px 12px; margin: 3px; cursor: pointer; }
        #calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; width: 300px; margin: 20px auto; }
        .day { padding: 10px; border: 1px solid #ccc; font-size: 12px; }
        .done { background: #4facfe; color: white; }
        #timeline { max-width: 400px; margin: 30px auto; text-align: left; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .post-card { border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>

    <h1>💧 集中ボトル</h1>
    <svg width="160" height="220" viewBox="0 0 200 260">
        <path d="M100 10 C140 70, 180 110, 180 160 C180 210, 140 250, 100 250 C60 250, 20 210, 20 160 C20 110, 60 70, 100 10 Z" fill="none" stroke="#333" stroke-width="4"/>
        <clipPath id="waterClip"><rect id="waterRect" x="0" y="250" width="200" height="250"/></clipPath>
        <path d="M100 10 C140 70, 180 110, 180 160 C180 210, 140 250, 100 250 C60 250, 20 210, 20 160 C20 110, 60 70, 100 10 Z" fill="#4facfe" clip-path="url(#waterClip)"/>
    </svg>
    <div id="waterPercent" style="margin:10px; font-weight:bold;">0%</div>
    <div id="streak" style="margin:10px; font-weight:bold; color:#ff7675;">🔥 連続日数: 0日</div>

    <h3>タスク追加</h3>
    <input type="text" id="taskName" placeholder="内容">
    <input type="number" id="taskPercent" placeholder="%" min="1" max="100">
    <button onclick="addTask()">追加</button>

    <h3>タスク一覧</h3>
    <div id="taskList"></div>
    <button onclick="resetWater()" style="margin-top:10px;">リセット</button>

    <h3>📅 勉強カレンダー</h3>
    <div id="calendar"></div>

    <div id="timeline">
        <h3 style="margin-top:0; text-align:center;">👥 みんなの勉強ボトル</h3>
        <div id="timeline-posts">読み込み中...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRwJ40dbH9VPj06Q3OzHEQdLwCUALDH2c",
            authDomain: "study-bottle.firebaseapp.com",
            projectId: "study-bottle",
            storageBucket: "study-bottle.firebasestorage.app",
            messagingSenderId: "58806870643",
            appId: "1:58806870643:web:53b3309cca97d1cb548006"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- UIとローカル保存処理 ---
        let totalWater = Number(localStorage.getItem('bottleTotalWater')) || 0;
        let tasks = JSON.parse(localStorage.getItem('bottleTasks')) || [];
        let completedDates = JSON.parse(localStorage.getItem('bottleDates')) || [];
        let streak = Number(localStorage.getItem('bottleStreak')) || 0;

        function updateUI() {
            totalWater = Math.min(totalWater, 100);
            document.getElementById('waterPercent').innerText = totalWater + "%";
            document.getElementById('waterRect').setAttribute('y', 250 - (totalWater * 2.4));
            document.getElementById('streak').innerText = "🔥 連続日数: " + streak + "日";
            let taskList = document.getElementById('taskList');
            taskList.innerHTML = "";
            tasks.forEach((t, i) => taskList.innerHTML += `<div>${t.name} (+${t.percent}%) <button onclick="doTask(${i})">やった</button></div>`);
            renderCalendar();
        }

        window.addTask = () => {
            let name = document.getElementById('taskName').value;
            let p = Number(document.getElementById('taskPercent').value);
            if(!name || !p) return;
            tasks.push({name, percent: p});
            localStorage.setItem('bottleTasks', JSON.stringify(tasks));
            updateUI();
        };

        window.doTask = async (i) => {
            let task = tasks[i];
            totalWater += task.percent;
            localStorage.setItem('bottleTotalWater', totalWater);
            await addDoc(collection(db, "posts"), { taskName: task.name, percent: task.percent, createdAt: new Date() });
            updateUI();
        };

        window.resetWater = () => { totalWater = 0; localStorage.setItem('bottleTotalWater', 0); updateUI(); };

        function renderCalendar() {
            let calendar = document.getElementById('calendar');
            calendar.innerHTML = "";
            let today = new Date();
            let daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
            for(let i = 1; i <= daysInMonth; i++) {
                let d = new Date(today.getFullYear(), today.getMonth(), i).toLocaleDateString();
                calendar.innerHTML += `<div class="day ${completedDates.includes(d) ? 'done' : ''}">${i}</div>`;
            }
        }

        // --- タイムライン読み込み（時間表示付き） ---
        signInAnonymously(auth).then(() => {
            const container = document.getElementById('timeline-posts');
            onSnapshot(collection(db, "posts"), (snapshot) => {
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString() : "日時不明";
                    container.innerHTML += `
                        <div class="post-card">
                            <div style="font-size: 11px; color: #888;">⏱️ ${date}</div>
                            🔥 <strong>${data.taskName}</strong> を <strong>${data.percent}%</strong> 達成！
                        </div>`;
                });
            });
        });
        updateUI();
    </script>
</body>
</html>
